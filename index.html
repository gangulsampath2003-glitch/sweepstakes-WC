<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup Sweepstakes</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen pb-20 select-none">

    <!-- USER WELCOME BANNER -->
    <div id="welcome-banner" class="bg-gradient-to-r from-amber-500 to-orange-600 px-4 py-2 text-xs font-bold text-center text-slate-900 hidden">
        <span id="welcome-text">Loading...</span>
    </div>

    <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700 sticky top-0 z-50 px-4 py-3 text-center">
        <h1 class="text-xl font-black tracking-wide bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">🏆 CUP SWEEPSTAKES</h1>
    </header>

    <main class="max-w-md mx-auto px-4 py-4">
        
        <!-- INITIAL DRAW / LOGIN MODAL -->
        <div id="name-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl w-full max-w-xs space-y-4 shadow-2xl text-center">
                <h3 class="text-lg font-black text-amber-400">Enter the Live Draw! 🎲</h3>
                <p class="text-xs text-slate-400">Type your name below to instantly draw your random World Cup teams!</p>
                
                <input type="text" id="username-input" placeholder="Enter your full name" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2 text-sm text-center focus:outline-none focus:border-amber-400 text-white font-bold">
                
                <button onclick="executeRandomDraw()" class="w-full bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-slate-950 font-black py-3 rounded-xl text-sm shadow-lg transition transform active:scale-95">
                    🎰 DRAW MY TEAMS
                </button>
            </div>
        </div>

        <!-- REVEAL ANIMATION SCREEN -->
        <div id="reveal-screen" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center p-6 text-center hidden">
            <div class="text-6xl animate-bounce mb-4">🎰</div>
            <h2 class="text-xl font-black tracking-wider text-amber-400 animate-pulse">SHUFFLING WORLD CUP TEAMS...</h2>
            <p class="text-xs text-slate-500 mt-2">Selecting allocations from available pools</p>
        </div>
        
        <!-- VIEW 1: LEADERBOARD -->
        <div id="leaderboard-view" class="view-panel space-y-4">
            <!-- PERSONAL COPY TOKEN SECTION -->
            <div id="share-card" class="bg-amber-500/10 border border-amber-500/30 p-4 rounded-2xl hidden">
                <p class="text-xs text-amber-400 font-bold mb-2 text-center">📢 Send your Draw Code to the group admin:</p>
                <div class="flex gap-2">
                    <input type="text" id="share-token" readonly class="bg-slate-950 text-slate-300 text-xs font-mono rounded-lg px-2 py-1 w-full text-center border border-slate-800">
                    <button onclick="copyShareToken()" class="bg-amber-500 text-slate-950 text-xs font-bold px-3 py-1 rounded-lg">Copy</button>
                </div>
            </div>

            <div class="bg-slate-800/50 p-4 rounded-2xl border border-slate-700/60 shadow-xl">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider mb-3">Live Sweepstakes Standings</h2>
                <div id="leaderboard-list" class="divide-y divide-slate-700/50"></div>
            </div>
        </div>

        <!-- VIEW 2: AUTOMATED AUTOMATIC FIXTURES -->
        <div id="fixtures-view" class="view-panel hidden">
            <div class="bg-slate-800/50 p-2 rounded-2xl border border-slate-700/60 shadow-xl overflow-hidden min-h-[500px]">
                <!-- SCOREAXIS REAL-TIME LIVE WIDGET FOR WORLD CUP -->
                <iframe 
                    id="scoreaxis-widget"
                    src="https://www.scoreaxis.com/widget/live-scores?autoHeight=1&bodyBackground=%231e293b&textColor=%23f8fafc&borderColor=%23334155&linksHoverColor=%23fbbf24&headerBackgroundColor=%230f172a&headerTextColor=%23fbbf24&tabsBackgroundColor=%231e293b&tabsTextColor=%2394a3b8&tabsActiveBackgroundColor=%23fbbf24&tabsActiveTextColor=%230f172a&instantsBackgroundColor=%230f172a&instantsTextColor=%23f8fafc&competitions=4" 
                    style="width: 100%; border: none; transition: all 0.3s ease;" 
                    height="600"
                    title="Live Football Scores">
                </iframe>
            </div>
        </div>

    </main>

    <!-- Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-800/90 backdrop-blur-lg border-t border-slate-700 px-6 py-2 flex justify-around max-w-md mx-auto shadow-2xl rounded-t-2xl">
        <button onclick="switchView('leaderboard')" id="nav-leaderboard" class="flex flex-col items-center gap-1 text-amber-400 transition">
            <span class="text-xl">📊</span><span class="text-xs font-semibold">Leaderboard</span>
        </button>
        <button onclick="switchView('fixtures')" id="nav-fixtures" class="flex flex-col items-center gap-1 text-slate-400 transition">
            <span class="text-xl">⚽</span><span class="text-xs font-semibold">Live Matchcenter</span>
        </button>
    </nav>

    <script>
        // 🏁 POOL OF TEAMS (App shuffles from this pool)
        const availableTeams = [
            "🇧🇷 Brazil", "🇫🇷 France", "🦁 England", "🇦🇷 Argentina", "🇪🇸 Spain", 
            "🇩🇪 Germany", "🇮🇹 Italy", "🇵🇹 Portugal", "🇳🇱 Netherlands", "🇲🇦 Morocco", 
            "🇺🇸 USA", "🇲🇽 Mexico", "🇨🇦 Canada", "🇧🇪 Belgium", "🇭🇷 Croatia"
        ];

        // 📝 ADMIN MASTER BOARD: Drop your friends' configurations right here!
        const masterLeaderboard = [
            { name: "Alex (Sample)", teams: ["🇧🇷 Brazil", "🦁 England"], points: 6 },
            { name: "Sarah (Sample)", teams: ["🇫🇷 France", "🇲🇦 Morocco"], points: 3 }
        ];

        function checkUserSession() {
            const savedName = localStorage.getItem('sw_name');
            if (!savedName) {
                document.getElementById('name-modal').classList.remove('hidden');
            } else {
                showUserDashboard(savedName);
            }
        }

        function executeRandomDraw() {
            const nameInput = document.getElementById('username-input').value.trim();
            if (!nameInput) return alert("Please enter your name first!");

            document.getElementById('reveal-screen').classList.remove('hidden');

            setTimeout(() => {
                let shuffled = [...availableTeams].sort(() => 0.5 - Math.random());
                let drawnTeams = [shuffled[0], shuffled[1]]; // Allocates two randomized teams

                localStorage.setItem('sw_name', nameInput);
                localStorage.setItem('sw_teams', JSON.stringify(drawnTeams));

                document.getElementById('reveal-screen').classList.add('hidden');
                document.getElementById('name-modal').classList.add('hidden');
                
                showUserDashboard(nameInput);
            }, 2000);
        }

        function showUserDashboard(name) {
            const banner = document.getElementById('welcome-banner');
            const text = document.getElementById('welcome-text');
            const cachedTeams = JSON.parse(localStorage.getItem('sw_teams') || "[]");

            banner.classList.remove('hidden');
            text.innerText = `👋 PROFILE: ${name.toUpperCase()} | YOUR TEAMS: ${cachedTeams.join(' & ')}`;

            const shareCard = document.getElementById('share-card');
            const shareInput = document.getElementById('share-token');
            shareCard.classList.remove('hidden');
            shareInput.value = `${name}: ${cachedTeams.join(' & ')}`;
        }

        function copyShareToken() {
            const tokenInput = document.getElementById('share-token');
            tokenInput.select();
            tokenInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(tokenInput.value);
            alert("Copied! Text this code to your group admin chat.");
        }

        function loadLeaderboard() {
            const list = document.getElementById('leaderboard-list');
            const sorted = [...masterLeaderboard].sort((a,b) => b.points - a.points);
            list.innerHTML = sorted.map((player, index) => `
                <div class="flex items-center justify-between py-3">
                    <div class="flex items-center gap-3">
                        <span class="text-sm font-bold text-slate-500">#${index + 1}</span>
                        <div>
                            <p class="font-bold text-white">${player.name}</p>
                            <p class="text-xs text-slate-400">${player.teams.join(' / ')}</p>
                        </div>
                    </div>
                    <span class="bg-slate-700 px-3 py-1 rounded-full text-xs font-black text-amber-400">${player.points} pts</span>
                </div>
            `).join('');
        }

        function switchView(view) {
            document.querySelectorAll('.view-panel').forEach(el => el.classList.add('hidden'));
            document.getElementById(`${view}-view`).classList.remove('hidden');
            document.getElementById('nav-leaderboard').className = view === 'leaderboard' ? 'flex flex-col items-center gap-1 text-amber-400' : 'flex flex-col items-center gap-1 text-slate-400';
            document.getElementById('nav-fixtures').className = view === 'fixtures' ? 'flex flex-col items-center gap-1 text-amber-400' : 'flex flex-col items-center gap-1 text-slate-400';
        }

        // Run
        checkUserSession();
        loadLeaderboard();
    </script>
</body>
</html>
