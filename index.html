<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>World Cup Tracker</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen pb-20 select-none">

    <!-- USER WELCOME BANNER -->
    <div id="welcome-banner" class="bg-gradient-to-r from-amber-500 to-orange-600 px-4 py-2 text-xs font-bold text-center text-slate-900 hidden">
        <span id="welcome-text">Loading...</span>
    </div>

    <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700 sticky top-0 z-50 px-4 py-3 text-center">
        <h1 class="text-xl font-black tracking-wide bg-gradient-to-r from-amber-400 to-orange-500 bg-clip-text text-transparent">🏆 MY CUP TRACKER</h1>
    </header>

    <main class="max-w-md mx-auto px-4 py-4">
        
        <!-- INITIAL DRAW / LOGIN MODAL -->
        <div id="name-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
            <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl w-full max-w-xs space-y-4 shadow-2xl text-center">
                <h3 class="text-lg font-black text-amber-400">Draw Your Teams! 🎲</h3>
                <p class="text-xs text-slate-400">Type your name below to instantly claim your random sweepstakes teams and unlock your personalized match schedule.</p>
                
                <input type="text" id="username-input" placeholder="Enter your name" class="w-full bg-slate-900 border border-slate-600 rounded-xl px-3 py-2 text-sm text-center focus:outline-none focus:border-amber-400 text-white font-bold">
                
                <button onclick="executeRandomDraw()" class="w-full bg-gradient-to-r from-amber-400 to-orange-500 hover:from-amber-500 hover:to-orange-600 text-slate-950 font-black py-3 rounded-xl text-sm shadow-lg transition transform active:scale-95">
                    🎰 GENERATE MY DRAW
                </button>
            </div>
        </div>

        <!-- REVEAL ANIMATION SCREEN -->
        <div id="reveal-screen" class="fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center p-6 text-center hidden">
            <div class="text-6xl animate-bounce mb-4">🎰</div>
            <h2 class="text-xl font-black tracking-wider text-amber-400 animate-pulse">SHUFFLING TEAMS...</h2>
        </div>
        
        <!-- LIVE MATCHES CONTAINER -->
        <div class="space-y-4">
            <div class="flex justify-between items-center px-1">
                <h2 class="text-sm font-bold text-slate-400 uppercase tracking-wider">Tournament Fixtures & Live Scores</h2>
                <span class="text-[10px] bg-amber-500/20 text-amber-400 px-2 py-0.5 rounded-full font-bold animate-pulse">● Live Tracking</span>
            </div>
            
            <!-- Dynamic Schedule gets injected here -->
            <div id="fixtures-container" class="space-y-3">
                <p class="text-center text-xs text-slate-500 py-8">Fetching real-time match data...</p>
            </div>
        </div>

    </main>

    <script>
        // Pool of available tournament teams
        const teamPool = [
            "USA", "Mexico", "Canada", "Brazil", "Argentina", "England", "France", 
            "Spain", "Germany", "Italy", "Portugal", "Netherlands", "Belgium", 
            "Morocco", "Senegal", "Japan", "South Korea", "Australia", "Uruguay"
        ];

        // We fetch live scores completely free from an open tournament API project
        async function fetchLiveScores() {
            try {
                // Using a reliable open-source sports API endpoint for tournament data
                const response = await fetch('https://api.openligadb.de/getmatchdata/wm');
                const data = await response.json();
                renderSchedule(data);
            } catch (error) {
                console.log("Error loading sports feed, using active match center fallback...", error);
                useFallbackSchedule();
            }
        }

        function checkUserSession() {
            const savedName = localStorage.getItem('sw_name');
            if (!savedName) {
                document.getElementById('name-modal').classList.remove('hidden');
            } else {
                showUserDashboard(savedName);
                fetchLiveScores();
            }
        }

        function executeRandomDraw() {
            const nameInput = document.getElementById('username-input').value.trim();
            if (!nameInput) return alert("Please type your name!");

            document.getElementById('reveal-screen').classList.remove('hidden');

            setTimeout(() => {
                let shuffled = [...teamPool].sort(() => 0.5 - Math.random());
                // Assign 2 completely random teams to this phone's memory
                let drawnTeams = [shuffled[0], shuffled[1]]; 

                localStorage.setItem('sw_name', nameInput);
                localStorage.setItem('sw_teams', JSON.stringify(drawnTeams));

                document.getElementById('reveal-screen').classList.add('hidden');
                document.getElementById('name-modal').classList.add('hidden');
                
                showUserDashboard(nameInput);
                fetchLiveScores();
            }, 2000);
        }

        function showUserDashboard(name) {
            const banner = document.getElementById('welcome-banner');
            const text = document.getElementById('welcome-text');
            const cachedTeams = JSON.parse(localStorage.getItem('sw_teams') || "[]");

            banner.classList.remove('hidden');
            text.innerText = `👋 PROFILE: ${name.toUpperCase()} | YOUR HIGH-PRIORITY TEAMS: ${cachedTeams.join(' & ').toUpperCase()}`;
        }

        function renderSchedule(matches) {
            const container = document.getElementById('fixtures-container');
            const userTeams = JSON.parse(localStorage.getItem('sw_teams') || "[]").map(t => t.toLowerCase());

            if (!matches || matches.length === 0) {
                useFallbackSchedule();
                return;
            }

            container.innerHTML = matches.map(match => {
                const team1 = match.team1.teamName;
                const team2 = match.team2.teamName;
                
                // Smart Highlight Engine: Checks if this phone owns either playing team
                const ownsTeam1 = userTeams.some(t => team1.toLowerCase().includes(t));
                const ownsTeam2 = userTeams.some(t => team2.toLowerCase().includes(t));
                const isUserMatch = ownsTeam1 || ownsTeam2;

                // Visual styling based on priority mapping
                const borderStyle = isUserMatch ? 'border-amber-500 bg-amber-500/5 shadow-lg shadow-amber-500/5' : 'border-slate-700/40 bg-slate-800/40';
                const badgeStyle = isUserMatch ? 'bg-amber-500 text-slate-950' : 'bg-slate-700 text-slate-300';
                
                // Parse date & time string cleanly
                const matchDate = new Date(match.matchDateTime);
                const localTime = matchDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const localDate = matchDate.toLocaleDateString([], {month: 'short', day: 'numeric'});

                // Check for live or finished score properties
                const score1 = match.matchResults && match.matchResults[0] ? match.matchResults[0].pointsTeam1 : "-";
                const score2 = match.matchResults && match.matchResults[0] ? match.matchResults[0].pointsTeam2 : "-";
                const scoreDisplay = match.matchIsFinished ? `${score1} - ${score2}` : (match.matchResults.length > 0 ? `${score1} - ${score2} (LIVE)` : 'vs');

                return `
                    <div class="p-4 rounded-2xl border ${borderStyle} transition duration-300">
                        <div class="flex justify-between items-center text-[10px] font-bold text-slate-500 mb-2 uppercase tracking-wider">
                            <span>📅 ${localDate}</span>
                            <span class="px-2 py-0.5 rounded-full ${badgeStyle}">⏰ ${localTime}</span>
                        </div>
                        <div class="flex items-center justify-between text-sm font-bold">
                            <div class="w-2/5 text-right pr-2 truncate ${ownsTeam1 ? 'text-amber-400 font-black text-base' : 'text-slate-200'}">
                                ${team1} ${ownsTeam1 ? '⭐' : ''}
                            </div>
                            <div class="bg-slate-950/80 px-3 py-1.5 rounded-xl border border-slate-700 text-center text-amber-400 tabular-nums min-w-[60px] text-xs">
                                ${scoreDisplay}
                            </div>
                            <div class="w-2/5 text-left pl-2 truncate ${ownsTeam2 ? 'text-amber-400 font-black text-base' : 'text-slate-200'}">
                                ${ownsTeam2 ? '⭐' : ''} ${team2}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function useFallbackSchedule() {
            // High-reliability layout wrapper if external server data fails to bind instantly
            const container = document.getElementById('fixtures-container');
            container.innerHTML = `
                <div class="text-center py-6 text-xs text-slate-500">
                    <p>Live schedule feed updating shortly.</p>
                </div>
            `;
        }

        // Initialize App Engine
        checkUserSession();
    </script>
</body>
</html>
